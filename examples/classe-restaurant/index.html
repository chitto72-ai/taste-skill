  <!-- FadingVideo — rAF-driven crossfade, manual looping -->
  <script type="text/babel">
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeTo = (target, duration = FADE_MS) => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          const from = parseFloat(video.style.opacity || "0");
          const start = performance.now();
          const step = (now) => {
            const t = Math.min((now - start) / duration, 1);
            video.style.opacity = String(from + (target - from) * t);
            if (t < 1) rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const onLoadedData = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1);
        };

        const onTimeUpdate = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0);
          }
        };

        const onEnded = () => {
          video.style.opacity = "0";
          setTimeout(() => {
            video.currentTime = 0;
            video.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1);
          }, 100);
        };

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          className={className}
          style={{ opacity: 0, ...style }}
          autoPlay
          muted
          playsInline
          preload="auto"
        />
      );
    }

    window.FadingVideo = FadingVideo;
  </script>

  <!-- BlurText — word-by-word blur-in -->
  <script type="text/babel">
    function BlurText({ text, className, align = "center" }) {
      const { motion } = window.Motion;
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = window.tr(text).split(" ");

      return (
        <p
          ref={ref}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: align === "left" ? "flex-start" : "center",
            rowGap: "0.1em",
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                inView
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    window.BlurText = BlurText;

  <!-- Language selector -->
  <script type="text/babel">
    function LanguageSelector({ lang, setLang, align = "right" }) {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef(null);

      React.useEffect(() => {
        const onDoc = (e) => {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener("mousedown", onDoc);
        return () => document.removeEventListener("mousedown", onDoc);
      }, []);

      const langs = window.LANGS || [];
      const current = langs.find((l) => l.code === lang) || langs[0];

      return (
        <div ref={ref} className="relative">
          <button
            onClick={() => setOpen(!open)}
            className="liquid-glass rounded-full h-12 px-4 flex items-center gap-2 text-white text-sm font-medium font-body"
            aria-label="Lingua / Language"
          >

              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
            {current ? current.short : "IT"}
          </button>
          {open && (
            <div
              className={
                "absolute mt-2 liquid-glass-strong rounded-[1.25rem] p-2 flex flex-col min-w-[160px] z-50 " +
                (align === "left" ? "left-0" : "right-0")
              }
            >
              {langs.map((l) => (
                <button
                  key={l.code}
                  onClick={() => { setLang(l.code); setOpen(false); }}
                  dir={l.dir}
                  className={
                    "px-3 py-2 text-sm font-body rounded-full text-start " +
                    (l.code === lang ? "text-white bg-white/10" : "text-white/80")
                  }
                >
                  {l.label}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    window.LanguageSelector = LanguageSelector;
  </script>

                    {window.tr("Iscriviti")}
                    <ArrowUpRight className="h-4 w-4" />
                  </button>
                </form>
                <div className="flex items-center gap-3 mt-8">
                  <a href={SITE.facebookHref} target="_blank" rel="noopener" aria-label="Facebook" className="liquid-glass rounded-full w-11 h-11 flex items-center justify-center text-white">
                    <FacebookIcon className="h-5 w-5" />
                  </a>
                  <a href={SITE.instagramHref} target="_blank" rel="noopener" aria-label="Instagram" className="liquid-glass rounded-full w-11 h-11 flex items-center justify-center text-white">
                    <InstagramIcon className="h-5 w-5" />
                  </a>
                </div>
              </div>
            </Reveal>
          </section>
        </div>
      );
    }

    window.ContattiPage = ContattiPage;
  </script>

  <!-- App + hash router -->
  <script type="text/babel">
    const ROUTES = {
      "/": window.HomePage,
      "/chi-siamo": window.ChiSiamoPage,
      "/menu": window.MenuPage,
      "/carta-dei-vini": window.CartaViniPage,
      "/eventi": window.EventiPage,
      "/contatti": window.ContattiPage,
    };

    function getRoute() {
      const hash = window.location.hash.replace(/^#/, "") || "/";
      return ROUTES[hash] ? hash : "/";
    }

    function App() {
      const [route, setRoute] = React.useState(getRoute());
      const [lang, setLangState] = React.useState(window.__LANG || "it");

      // Keep the global in sync before children render so tr() resolves correctly.
      window.__LANG = lang;

      React.useEffect(() => {
        const onHashChange = () => setRoute(getRoute());
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      React.useEffect(() => {
        window.scrollTo(0, 0);
      }, [route]);

      React.useEffect(() => {
        if (window.__setLang) window.__setLang(lang);
      }, [lang]);

      const Page = ROUTES[route];

      return (
        <main className="bg-black">
          <Navbar route={route} lang={lang} setLang={setLangState} />
          <Page key={route + "-" + lang} />
          <BookingBand />
          <Footer />
        </main>
      );
    }

    window.App = App;

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
