  <!-- FadingVideo — rAF-driven crossfade, manual looping -->
  <script type="text/babel">
    const FADE_MS = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const fadeTo = (target, duration = FADE_MS) => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          const from = parseFloat(video.style.opacity || "0");
          const start = performance.now();
          const step = (now) => {
            const t = Math.min((now - start) / duration, 1);
            video.style.opacity = String(from + (target - from) * t);
            if (t < 1) rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const onLoadedData = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1);
        };

        const onTimeUpdate = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0);
          }
        };

        const onEnded = () => {
          video.style.opacity = "0";
          setTimeout(() => {
            video.currentTime = 0;
            video.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1);
          }, 100);
        };

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          className={className}
          style={{ opacity: 0, ...style }}
          autoPlay
          muted
          playsInline
          preload="auto"
        />
      );
    }

    window.FadingVideo = FadingVideo;
  </script>

  <!-- BlurText — word-by-word blur-in -->
  <script type="text/babel">
    function BlurText({ text, className, align = "center" }) {
      const { motion } = window.Motion;
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={ref}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: align === "left" ? "flex-start" : "center",
            rowGap: "0.1em",
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                inView
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : {}
              }
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
              style={{ display: "inline-block", marginRight: "0.28em" }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    window.BlurText = BlurText;
  </script>

  <!-- Reveal — shared blur-entrance wrapper -->
  <script type="text/babel">

          initial={{ filter: "blur(10px)", opacity: 0, y: 20 }}
          whileInView={{ filter: "blur(0px)", opacity: 1, y: 0 }}
          viewport={{ once: true, amount }}
          transition={{ duration: 0.8, delay, ease: "easeOut" }}
          className={className}
        >
          {children}
        </motion.div>
      );
    }

  <!-- App + hash router -->
  <script type="text/babel">
    const ROUTES = {
      "/": window.HomePage,
      "/menu": window.MenuPage,
      "/chi-siamo": window.ChiSiamoPage,
      "/esperienze": window.EsperienzePage,
      "/contatti": window.ContattiPage,
    };

    function getRoute() {
      const hash = window.location.hash.replace(/^#/, "") || "/";
      return ROUTES[hash] ? hash : "/";
    }

    function App() {
      const [route, setRoute] = React.useState(getRoute());

      React.useEffect(() => {
        const onHashChange = () => setRoute(getRoute());
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      React.useEffect(() => {
        window.scrollTo(0, 0);
      }, [route]);

      const Page = ROUTES[route];

      return (
        <main className="bg-black">
          <Navbar route={route} />
          <Page key={route} />
          <Footer />
        </main>
      );
    }

    window.App = App;

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
