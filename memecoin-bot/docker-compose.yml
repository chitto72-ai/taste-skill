services:
  bot:
    build: .
    image: memecoin-bot:1.0.0
    container_name: memecoin-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      DB_DRIVER: ${DB_DRIVER:-file}
      DB_PATH: /app/data/bot.db
      KEYSTORE_DIR: /app/keystore
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    volumes:
      - bot-data:/app/data
      - ./keystore:/app/keystore:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  bot-data:
