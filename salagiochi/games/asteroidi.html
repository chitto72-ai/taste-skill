<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Asteroidi — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(24px,6.5vw,40px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:20px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:420px;margin:0 auto;touch-action:none}
canvas{background:radial-gradient(circle at 50% 50%,#0a0430,#05010f);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin:18px auto 0}
.pad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:10px;font-size:20px;padding:16px 0;font-family:inherit;cursor:pointer}
.pad button:active{background:rgba(0,255,240,.3)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Asteroidi</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Punti: <b id="score">0</b></span><span>Vite: <b id="lives">3</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="420" height="420"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Asteroidi</h2>
      <p id="ovp">Ruota, spingi e spara. Distruggi tutti gli asteroidi!</p>
      <button class="btn" id="start">Gioca</button>
    </div>
  </div>

  <div class="controls">◀ ▶ ruota · ▲ spinta · Spazio spara</div>
  <div class="pad">
    <button data-a="left">↺</button>
    <button data-a="thrust">▲</button>
    <button data-a="right">↻</button>
    <button data-a="fire">🔫</button>
  </div>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_asteroidi_best';
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  let ship,rocks,bullets,score,lives,running,keys,fireCd,inv;
  function wrap(o){if(o.x<0)o.x+=W;if(o.x>W)o.x-=W;if(o.y<0)o.y+=H;if(o.y>H)o.y-=H;}
  function newRock(x,y,r){const a=Math.random()*6.28,sp=(3-r*0.7)*(Math.random()*.6+.5);
    return{x,y,r:r*12,tier:r,dx:Math.cos(a)*sp,dy:Math.sin(a)*sp,rot:Math.random()*6.28,vr:(Math.random()-.5)*.05,
      verts:Array.from({length:9},()=>0.7+Math.random()*0.5)};}
  function spawnWave(n){for(let i=0;i<n;i++){let x,y;do{x=Math.random()*W;y=Math.random()*H;}while(Math.hypot(x-W/2,y-H/2)<90);rocks.push(newRock(x,y,3));}}
  function reset(){ship={x:W/2,y:H/2,a:-Math.PI/2,dx:0,dy:0};rocks=[];bullets=[];score=0;lives=3;running=true;keys={};fireCd=0;inv=90;spawnWave(4);scoreEl.textContent=0;livesEl.textContent=3;}
  function start(){reset();ov.classList.add('hidden');loop();}
  function over(){running=false;if(score>best){best=score;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent='Game Over';ovp.innerHTML='Punteggio: <b>'+score+'</b><br>Record: '+best;startBtn.textContent='Rigioca';ov.classList.remove('hidden');}
  function fire(){if(fireCd>0)return;fireCd=12;bullets.push({x:ship.x+Math.cos(ship.a)*14,y:ship.y+Math.sin(ship.a)*14,dx:Math.cos(ship.a)*6+ship.dx,dy:Math.sin(ship.a)*6+ship.dy,life:60});}
  function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}
  function update(){
    if(fireCd>0)fireCd--;if(inv>0)inv--;
    if(keys.left)ship.a-=0.09;if(keys.right)ship.a+=0.09;
    if(keys.thrust){ship.dx+=Math.cos(ship.a)*0.15;ship.dy+=Math.sin(ship.a)*0.15;}
    ship.dx*=0.99;ship.dy*=0.99;ship.x+=ship.dx;ship.y+=ship.dy;wrap(ship);
    if(keys.fire)fire();
    bullets.forEach(b=>{b.x+=b.dx;b.y+=b.dy;b.life--;wrap(b);});bullets=bullets.filter(b=>b.life>0);
    rocks.forEach(r=>{r.x+=r.dx;r.y+=r.dy;r.rot+=r.vr;wrap(r);});
    // bullet vs rock
    for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];
      for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];
        if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
          bullets.splice(j,1);rocks.splice(i,1);score+=(4-r.tier)*20;scoreEl.textContent=score;
          if(r.tier>1){rocks.push(newRock(r.x,r.y,r.tier-1),newRock(r.x,r.y,r.tier-1));}
          break;
        }
      }
    }
    // ship vs rock
    if(inv<=0)for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+8){
      lives--;livesEl.textContent=lives;inv=90;ship.x=W/2;ship.y=H/2;ship.dx=ship.dy=0;
      if(lives<=0)return over();break;}}
    if(rocks.length===0)spawnWave(4+((score/400)|0));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#9d4edd';ctx.lineWidth=1.5;
    rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.beginPath();
      for(let k=0;k<r.verts.length;k++){const ang=k/r.verts.length*6.28,rr=r.r*r.verts[k];const x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();ctx.shadowColor='#9d4edd';ctx.shadowBlur=8;ctx.stroke();ctx.restore();});
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,7);ctx.fill();});
    if(inv<=0||Math.floor(inv/6)%2===0){
      ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);ctx.strokeStyle='#00fff0';ctx.shadowColor='#00fff0';ctx.shadowBlur=10;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.lineTo(-10,9);ctx.closePath();ctx.stroke();
      if(keys.thrust){ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-16,0);ctx.strokeStyle='#ff2e97';ctx.stroke();}
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  const map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'thrust',w:'thrust',' ':'fire'};
  window.addEventListener('keydown',e=>{const m=map[e.key.toLowerCase()];if(m){keys[m]=true;e.preventDefault();}});
  window.addEventListener('keyup',e=>{const m=map[e.key.toLowerCase()];if(m)keys[m]=false;});
  document.querySelectorAll('.pad button').forEach(b=>{const a=b.dataset.a;
    const on=e=>{e.preventDefault();keys[a]=true;},off=()=>keys[a]=false;
    b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('mousedown',()=>keys[a]=true);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);});
  startBtn.addEventListener('click',start);
  reset();running=false;draw();
})();
</script>
</body>
</html>
