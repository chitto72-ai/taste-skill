<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blocchi — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(26px,7vw,42px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:18px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:280px;margin:0 auto;touch-action:none}
canvas{background:rgba(5,1,15,.85);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
.dpad{display:grid;grid-template-columns:repeat(4,64px);gap:10px;justify-content:center;margin:18px auto 0}
.dpad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:10px;font-size:22px;padding:14px 0;font-family:inherit;cursor:pointer}
.dpad button:active{background:rgba(0,255,240,.3)}
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1897982289083904" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Blocchi</h1>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Punti: <b id="score">0</b></span><span>Livello: <b id="level">1</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="240" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Blocchi</h2>
      <p id="ovp">Ruota e incastra i pezzi. Completa le righe!</p>
      <button class="btn" id="start">Gioca</button>
    </div>
  </div>

  <div class="controls">◀ ▶ muovi · ▲ ruota · ▼ giù · Spazio: caduta</div>
  <div class="dpad">
    <button data-a="left">◀</button>
    <button data-a="rot">⟳</button>
    <button data-a="down">▼</button>
    <button data-a="right">▶</button>
  </div>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d');
  const COLS=10,ROWS=20,S=cv.width/COLS;
  const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_blocchi_best';
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  const SHAPES={
    I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
  };
  const COL={I:'#00fff0',O:'#ffe600',T:'#9d4edd',S:'#39ff14',Z:'#ff2e97',J:'#4d7cff',L:'#ff8a00'};
  let grid,cur,px,py,score,level,lines,running,dropTimer,dropInt;
  function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}
  function rand(){const k=Object.keys(SHAPES);return k[(Math.random()*k.length)|0];}
  function spawn(){const t=rand();cur={t,m:SHAPES[t].map(r=>r.slice())};px=((COLS-cur.m[0].length)/2)|0;py=0;if(collide(px,py,cur.m))return over();}
  function collide(x,y,m){
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
      if(!m[r][c])continue;const nx=x+c,ny=y+r;
      if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&grid[ny][nx])return true;
    }return false;
  }
  function merge(){for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c]){if(py+r>=0)grid[py+r][px+c]=cur.t;}}
  function rotate(){const m=cur.m,nm=m[0].map((_,i)=>m.map(row=>row[i]).reverse());if(!collide(px,py,nm))cur.m=nm;}
  function clearLines(){
    let n=0;
    for(let r=ROWS-1;r>=0;r--){if(grid[r].every(c=>c)){grid.splice(r,1);grid.unshift(Array(COLS).fill(null));n++;r++;}}
    if(n){lines+=n;score+=[0,40,100,300,1200][n]*level;scoreEl.textContent=score;
      const nl=((lines/10)|0)+1;if(nl!==level){level=nl;levelEl.textContent=level;dropInt=Math.max(120,600-(level-1)*45);}}
  }
  function tick(){if(!running)return;if(!move(0,1)){merge();clearLines();spawn();}draw();}
  function move(dx,dy){if(collide(px+dx,py+dy,cur.m))return false;px+=dx;py+=dy;draw();return true;}
  function hardDrop(){while(move(0,1)){}tick();}
  function reset(){grid=newGrid();score=0;level=1;lines=0;dropInt=600;running=true;scoreEl.textContent=0;levelEl.textContent=1;spawn();}
  function start(){clearInterval(dropTimer);reset();ov.classList.add('hidden');dropTimer=setInterval(tick,dropInt);draw();
    // adegua intervallo dinamicamente
    lastInt=dropInt;}
  let lastInt;
  setInterval(()=>{if(running&&dropInt!==lastInt){clearInterval(dropTimer);dropTimer=setInterval(tick,dropInt);lastInt=dropInt;}},200);
  function over(){running=false;clearInterval(dropTimer);if(score>best){best=score;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent='Game Over';ovp.innerHTML='Punteggio: <b>'+score+'</b><br>Record: '+best;startBtn.textContent='Rigioca';ov.classList.remove('hidden');}
  function cell(x,y,color){ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=6;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.shadowBlur=0;}
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='rgba(0,255,240,0.05)';
    for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,cv.height);ctx.stroke();}
    for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(cv.width,i*S);ctx.stroke();}
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])cell(c,r,COL[grid[r][c]]);
    if(cur)for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c])cell(px+c,py+r,COL[cur.t]);
  }
  window.addEventListener('keydown',e=>{
    if(!running)return;const k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a'){e.preventDefault();move(-1,0);}
    else if(k==='arrowright'||k==='d'){e.preventDefault();move(1,0);}
    else if(k==='arrowdown'||k==='s'){e.preventDefault();move(0,1);}
    else if(k==='arrowup'||k==='w'){e.preventDefault();rotate();draw();}
    else if(k===' '){e.preventDefault();hardDrop();}
  });
  document.querySelectorAll('.dpad button').forEach(b=>{
    b.addEventListener('click',()=>{if(!running)return;const a=b.dataset.a;
      if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='down')move(0,1);else if(a==='rot'){rotate();draw();}});
  });
  startBtn.addEventListener('click',start);
  grid=newGrid();draw();
})();
</script>
</body>
</html>
