<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rompimuro — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(26px,7vw,42px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:22px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:440px;margin:0 auto;touch-action:none}
canvas{background:rgba(5,1,15,.85);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:26px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
.dpad{display:grid;grid-template-columns:repeat(2,88px);gap:12px;justify-content:center;margin:18px auto 0}
.dpad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:10px;font-size:26px;padding:14px 0;font-family:inherit;cursor:pointer}
.dpad button:active{background:rgba(0,255,240,.3)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Rompimuro</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Punti: <b id="score">0</b></span><span>Vite: <b id="lives">3</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Rompimuro</h2>
      <p id="ovp">Muovi la racchetta con frecce, mouse o dito. Rompi tutti i mattoni!</p>
      <button class="btn" id="start">Gioca</button>
    </div>
  </div>

  <div class="controls">◀ ▶ / A D · Mouse o dito sul campo · Pausa: P</div>
  <div class="dpad">
    <button data-d="-1">◀</button><button data-d="1">▶</button>
  </div>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_breakout_best';
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  const COLS=8,ROWS=5,BW=W/COLS,BH=22,colors=['#ff2e97','#ffe600','#39ff14','#00fff0','#9d4edd'];
  let paddle,ball,bricks,score,lives,running,paused,move;
  function makeBricks(){bricks=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:c*BW,y:40+r*BH,alive:true,col:colors[r]});}
  function resetBall(){ball={x:W/2,y:H-60,dx:(Math.random()<.5?-1:1)*3.2,dy:-3.6,r:7};paddle={x:W/2-45,y:H-24,w:90,h:12,speed:7};}
  function reset(){score=0;lives=3;paused=false;running=true;move=0;scoreEl.textContent=0;livesEl.textContent=3;makeBricks();resetBall();}
  function start(){reset();ov.classList.add('hidden');loop();}
  function over(win){running=false;if(score>best){best=score;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent=win?'Hai Vinto!':'Game Over';ovp.innerHTML='Punteggio: <b>'+score+'</b><br>Record: '+best;startBtn.textContent='Rigioca';ov.classList.remove('hidden');}
  function loop(){if(!running)return;if(!paused)update();draw();requestAnimationFrame(loop);}
  function update(){
    paddle.x+=move*paddle.speed;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
    ball.x+=ball.dx;ball.y+=ball.dy;
    if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;
    if(ball.y<ball.r)ball.dy*=-1;
    if(ball.y>H+ball.r){lives--;livesEl.textContent=lives;if(lives<=0)return over(false);resetBall();return;}
    if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.dy>0){
      const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.dx=hit*4.5;ball.dy=-Math.abs(ball.dy);
    }
    for(const b of bricks){if(!b.alive)continue;
      if(ball.x>b.x&&ball.x<b.x+BW&&ball.y-ball.r<b.y+BH&&ball.y+ball.r>b.y){
        b.alive=false;ball.dy*=-1;score+=10;scoreEl.textContent=score;
        if(bricks.every(k=>!k.alive))return over(true);break;
      }
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.col;ctx.shadowColor=b.col;ctx.shadowBlur=8;ctx.fillRect(b.x+2,b.y+2,BW-4,BH-4);});
    ctx.shadowBlur=10;ctx.fillStyle='#00fff0';ctx.shadowColor='#00fff0';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){move=-1;e.preventDefault();}if(k==='arrowright'||k==='d'){move=1;e.preventDefault();}if(k==='p')paused=!paused;});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowleft','a','arrowright','d'].includes(k))move=0;});
  document.querySelectorAll('.dpad button').forEach(b=>{
    const d=+b.dataset.d;const on=()=>move=d,off=()=>move=0;
    b.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    b.addEventListener('touchend',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);
  });
  function pointAt(clientX){const r=cv.getBoundingClientRect();const x=(clientX-r.left)/r.width*W;if(running)paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));}
  cv.addEventListener('mousemove',e=>pointAt(e.clientX));
  cv.addEventListener('touchmove',e=>{e.preventDefault();pointAt(e.touches[0].clientX);},{passive:false});
  startBtn.addEventListener('click',start);
  reset();running=false;draw();
})();
</script>
</body>
</html>
