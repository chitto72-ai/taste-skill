<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Campo Minato — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(24px,6.5vw,40px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:18px;margin:8px 0 12px;font-size:15px;letter-spacing:1px;flex-wrap:wrap}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;max-width:400px;margin:0 auto}
.board{display:grid;gap:3px;background:rgba(5,1,15,.6);border:2px solid rgba(0,255,240,.4);border-radius:10px;padding:8px;box-shadow:0 0 26px rgba(0,255,240,.15)}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(13px,4vw,18px);background:linear-gradient(135deg,#1e0d4a,#33176e);border:1px solid rgba(0,255,240,.25);border-radius:4px;cursor:pointer;user-select:none}
.cell.rev{background:rgba(5,1,15,.7);border-color:rgba(157,78,221,.3);cursor:default}
.cell.mine{background:#ff2e97;color:#05010f}
.cell.flag{color:var(--yellow)}
.c1{color:#00fff0}.c2{color:#39ff14}.c3{color:#ffe600}.c4{color:#ff8a00}.c5{color:#ff2e97}.c6{color:#9d4edd}.c7{color:#ff5252}.c8{color:#e8e6ff}
.tools{display:flex;justify-content:center;gap:10px;margin:14px 0}
.flagbtn{cursor:pointer;background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:8px;padding:10px 18px;font-family:inherit;letter-spacing:1px;font-size:14px}
.flagbtn.on{background:var(--yellow);color:#05010f;border-color:var(--yellow)}
.controls{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:-6px;background:rgba(5,1,15,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Campo Minato</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Mine: <b id="mines">10</b></span><span>Tempo: <b id="time">0</b>s</span><span class="rec">Record: <b id="best">—</b></span></div>

  <div class="stage">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="ov">
      <h2 id="ovt"></h2>
      <p id="ovp"></p>
      <button class="btn" id="restart">Rigioca</button>
    </div>
  </div>

  <div class="tools">
    <button class="flagbtn" id="flag">🚩 Modalità bandierina: OFF</button>
    <button class="btn" id="newgame" style="padding:10px 18px;font-size:13px">Nuova</button>
  </div>
  <div class="controls">Tocca per scoprire · Attiva la bandierina o tieni premuto per segnalare</div>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const N=9,MINES=10;
  const board=document.getElementById('board'),minesEl=document.getElementById('mines'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp');
  const flagBtn=document.getElementById('flag');
  const KEY='sg_campominato_best';
  let best=localStorage.getItem(KEY);bestEl.textContent=best?best+'s':'—';
  board.style.gridTemplateColumns='repeat('+N+',1fr)';
  let cells,mineSet,revealed,flags,over,started,timer,secs,flagMode=false;
  function idx(r,c){return r*N+c;}
  function neighbors(r,c){const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)out.push([nr,nc]);}return out;}
  function build(){
    board.innerHTML='';cells=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const el=document.createElement('div');el.className='cell';el.dataset.r=r;el.dataset.c=c;
      el.addEventListener('click',()=>onCell(r,c));
      el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
      let lp;el.addEventListener('touchstart',()=>{lp=setTimeout(()=>{toggleFlag(r,c);lp=null;},400);},{passive:true});
      el.addEventListener('touchend',()=>{if(lp){clearTimeout(lp);}});
      el.addEventListener('touchmove',()=>{if(lp){clearTimeout(lp);lp=null;}});
      board.appendChild(el);cells.push(el);
    }
  }
  function reset(){
    mineSet=new Set();revealed=new Set();flags=new Set();over=false;started=false;secs=0;timeEl.textContent=0;minesEl.textContent=MINES;
    clearInterval(timer);ov.classList.add('hidden');
    cells.forEach(el=>{el.className='cell';el.textContent='';});
  }
  function placeMines(safeR,safeC){
    while(mineSet.size<MINES){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;if((r===safeR&&c===safeC)||mineSet.has(idx(r,c)))continue;mineSet.add(idx(r,c));}
  }
  function count(r,c){let n=0;neighbors(r,c).forEach(([nr,nc])=>{if(mineSet.has(idx(nr,nc)))n++;});return n;}
  function onCell(r,c){
    if(over)return;
    if(flagMode){toggleFlag(r,c);return;}
    if(flags.has(idx(r,c)))return;
    if(!started){started=true;placeMines(r,c);timer=setInterval(()=>{secs++;timeEl.textContent=secs;},1000);}
    reveal(r,c);
    if(mineSet.has(idx(r,c)))return lose(r,c);
    checkWin();
  }
  function reveal(r,c){
    const i=idx(r,c);if(revealed.has(i)||flags.has(i))return;revealed.add(i);
    const el=cells[i];el.classList.add('rev');
    if(mineSet.has(i)){el.classList.add('mine');el.textContent='💣';return;}
    const n=count(r,c);
    if(n){el.textContent=n;el.classList.add('c'+n);}
    else neighbors(r,c).forEach(([nr,nc])=>reveal(nr,nc));
  }
  function toggleFlag(r,c){
    if(over||!started&&flags.size===0&&revealed.size===0){/*permetti flag anche prima*/}
    if(over)return;const i=idx(r,c);if(revealed.has(i))return;const el=cells[i];
    if(flags.has(i)){flags.delete(i);el.classList.remove('flag');el.textContent='';}
    else{flags.add(i);el.classList.add('flag');el.textContent='🚩';}
    minesEl.textContent=MINES-flags.size;
  }
  function lose(r,c){
    over=true;clearInterval(timer);
    mineSet.forEach(m=>{const el=cells[m];if(!flags.has(m)){el.classList.add('rev','mine');el.textContent='💣';}});
    cells[idx(r,c)].style.background='#ff5252';
    ovt.textContent='BOOM!';ovp.innerHTML='Hai colpito una mina.<br>Riprova!';ov.classList.remove('hidden');
  }
  function checkWin(){
    if(revealed.size===N*N-MINES){
      over=true;clearInterval(timer);
      let msg='Completato in <b>'+secs+'</b> secondi!';
      if(!best||secs<+best){best=secs;localStorage.setItem(KEY,best);bestEl.textContent=best+'s';msg+='<br>🏆 Nuovo record!';}
      ovt.textContent='Bonificato!';ovp.innerHTML=msg;ov.classList.remove('hidden');
    }
  }
  flagBtn.addEventListener('click',()=>{flagMode=!flagMode;flagBtn.classList.toggle('on',flagMode);flagBtn.textContent='🚩 Modalità bandierina: '+(flagMode?'ON':'OFF');});
  document.getElementById('restart').addEventListener('click',reset);
  document.getElementById('newgame').addEventListener('click',reset);
  build();reset();
})();
</script>
</body>
</html>
