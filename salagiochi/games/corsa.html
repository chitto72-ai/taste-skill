<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corsa Infinita — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-size:clamp(22px,6vw,38px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:22px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:480px;margin:0 auto;touch-action:none}
canvas{background:linear-gradient(180deg,#0a0430 60%,#1a0a45);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Corsa Infinita</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Distanza: <b id="score">0</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="480" height="260"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Corsa Infinita</h2>
      <p id="ovp">Salta gli ostacoli! Tocca lo schermo o premi Spazio per saltare.</p>
      <button class="btn" id="start">Corri</button>
    </div>
  </div>

  <div class="controls">Spazio / ▲ / Tocco per saltare · Tieni premuto per salto più alto</div>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_corsa_best';
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  const GROUND=H-40,GRAV=0.7;
  let player,obs,clouds,speed,dist,running,frame,holding,jumpHeld;
  function reset(){player={x:60,y:GROUND-34,w:26,h:34,vy:0,onGround:true};obs=[];clouds=[{x:100,y:50},{x:300,y:80},{x:450,y:40}];speed=5;dist=0;running=true;frame=0;jumpHeld=0;scoreEl.textContent=0;}
  function start(){reset();ov.classList.add('hidden');loop();}
  function jump(){if(player.onGround){player.vy=-11;player.onGround=false;jumpHeld=1;}}
  function over(){running=false;const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent='Sei caduto!';ovp.innerHTML='Distanza: <b>'+d+'</b> m<br>Record: '+best;startBtn.textContent='Riprova';ov.classList.remove('hidden');}
  function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}
  function update(){
    frame++;dist+=speed*0.05;scoreEl.textContent=Math.floor(dist);
    if(frame%600===0)speed+=0.6;
    // salto prolungato
    if(holding&&jumpHeld>0&&jumpHeld<12){player.vy-=0.35;jumpHeld++;}
    player.vy+=GRAV;player.y+=player.vy;
    if(player.y>=GROUND-player.h){player.y=GROUND-player.h;player.vy=0;player.onGround=true;}
    // genera ostacoli
    const last=obs[obs.length-1];
    if(!last||last.x<W-(140+Math.random()*160)){
      const tall=Math.random()<.3;obs.push({x:W+10,w:tall?18:24,h:tall?42:26});
    }
    obs.forEach(o=>o.x-=speed);obs=obs.filter(o=>o.x+o.w>-10);
    clouds.forEach(c=>{c.x-=speed*0.2;if(c.x<-40)c.x=W+Math.random()*60;});
    // collisioni
    for(const o of obs){const oy=GROUND-o.h;
      if(player.x+player.w-4>o.x&&player.x+4<o.x+o.w&&player.y+player.h-2>oy)return over();}
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(157,78,221,.25)';clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,26,10,0,0,7);ctx.fill();});
    // suolo
    ctx.strokeStyle='#00fff0';ctx.shadowColor='#00fff0';ctx.shadowBlur=8;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
    ctx.strokeStyle='rgba(0,255,240,.3)';ctx.shadowBlur=0;
    for(let i=0;i<W;i+=40){const x=(i-(frame*speed)%40);ctx.beginPath();ctx.moveTo(x,GROUND+6);ctx.lineTo(x+16,GROUND+6);ctx.stroke();}
    // ostacoli
    ctx.fillStyle='#ff2e97';ctx.shadowColor='#ff2e97';ctx.shadowBlur=8;
    obs.forEach(o=>ctx.fillRect(o.x,GROUND-o.h,o.w,o.h));
    // player
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.fillRect(player.x,player.y,player.w,player.h);
    ctx.fillStyle='#05010f';ctx.fillRect(player.x+player.w-9,player.y+7,4,4);
    ctx.shadowBlur=0;
  }
  function press(e){if(e)e.preventDefault();if(!running)return;holding=true;jump();}
  function release(){holding=false;}
  window.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'){press(e);}});
  window.addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w')release();});
  cv.addEventListener('mousedown',press);cv.addEventListener('mouseup',release);
  cv.addEventListener('touchstart',press,{passive:false});cv.addEventListener('touchend',release);
  startBtn.addEventListener('click',start);
  reset();running=false;draw();
})();
</script>
</body>
</html>
