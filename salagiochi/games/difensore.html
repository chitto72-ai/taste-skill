<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Difensore Stellare — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(22px,6vw,38px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:20px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:400px;margin:0 auto;touch-action:none}
canvas{background:radial-gradient(circle at 50% 20%,#1a0a45,#05010f);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
.dpad{display:grid;grid-template-columns:repeat(2,88px);gap:12px;justify-content:center;margin:18px auto 0}
.dpad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:10px;font-size:26px;padding:14px 0;font-family:inherit;cursor:pointer}
.dpad button:active{background:rgba(0,255,240,.3)}
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1897982289083904" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Difensore Stellare</h1>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Punti: <b id="score">0</b></span><span>Vite: <b id="lives">3</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="400" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Difensore</h2>
      <p id="ovp">Muovi con ◀ ▶ o il dito. Spari automatici. Difendi la galassia!</p>
      <button class="btn" id="start">Gioca</button>
    </div>
  </div>

  <div class="controls">◀ ▶ / A D · Trascina col dito · Spari automatici</div>
  <div class="dpad">
    <button data-d="-1">◀</button><button data-d="1">▶</button>
  </div>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_difensore_best';
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  let ship,bullets,aliens,ebul,stars,score,lives,running,move,frame,fireCd;
  function initStars(){stars=[];for(let i=0;i<40;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.5});}
  function spawnWave(){const rows=2+Math.min(3,(score/300)|0);for(let r=0;r<rows;r++)for(let c=0;c<7;c++)aliens.push({x:30+c*50,y:40+r*40,alive:true,ph:Math.random()*6});}
  function reset(){ship={x:W/2-18,y:H-40,w:36,h:20};bullets=[];aliens=[];ebul=[];score=0;lives=3;move=0;frame=0;fireCd=0;running=true;initStars();spawnWave();scoreEl.textContent=0;livesEl.textContent=3;}
  function start(){reset();ov.classList.add('hidden');loop();}
  function over(){running=false;if(score>best){best=score;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent='Game Over';ovp.innerHTML='Punteggio: <b>'+score+'</b><br>Record: '+best;startBtn.textContent='Rigioca';ov.classList.remove('hidden');}
  function loop(){if(!running)return;update();draw();requestAnimationFrame(loop);}
  function update(){
    frame++;
    ship.x+=move*5;ship.x=Math.max(0,Math.min(W-ship.w,ship.x));
    if(--fireCd<=0){bullets.push({x:ship.x+ship.w/2-2,y:ship.y});fireCd=16;}
    bullets.forEach(b=>b.y-=7);bullets=bullets.filter(b=>b.y>-10);
    const dir=Math.sin(frame/40)*1.1;
    aliens.forEach(a=>{if(!a.alive)return;a.x+=dir;a.y+=0.12;
      if(Math.random()<0.004)ebul.push({x:a.x+15,y:a.y+20});});
    ebul.forEach(b=>b.y+=4);ebul=ebul.filter(b=>b.y<H+10);
    // collisioni proiettili-alieni
    for(const b of bullets)for(const a of aliens){if(!a.alive)continue;
      if(b.x<a.x+30&&b.x+4>a.x&&b.y<a.y+22&&b.y>a.y){a.alive=false;b.y=-99;score+=10;scoreEl.textContent=score;}}
    bullets=bullets.filter(b=>b.y>-10);
    // proiettili nemici vs nave
    for(const b of ebul){if(b.x>ship.x&&b.x<ship.x+ship.w&&b.y>ship.y&&b.y<ship.y+ship.h){b.y=H+99;hit();}}
    ebul=ebul.filter(b=>b.y<H+10);
    // alieni che raggiungono la nave / il fondo
    for(const a of aliens){if(a.alive&&a.y+22>=ship.y){return over();}}
    if(aliens.every(a=>!a.alive)){spawnWave();}
  }
  function hit(){lives--;livesEl.textContent=lives;if(lives<=0)over();}
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.6)';stars.forEach(s=>{s.y+=s.s;if(s.y>H)s.y=0;ctx.fillRect(s.x,s.y,s.s,s.s);});
    // nave
    ctx.fillStyle='#00fff0';ctx.shadowColor='#00fff0';ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(ship.x+ship.w/2,ship.y);ctx.lineTo(ship.x,ship.y+ship.h);ctx.lineTo(ship.x+ship.w,ship.y+ship.h);ctx.closePath();ctx.fill();
    // proiettili
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';bullets.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
    // alieni
    aliens.forEach(a=>{if(!a.alive)return;ctx.fillStyle='#ff2e97';ctx.shadowColor='#ff2e97';ctx.fillRect(a.x,a.y,30,20);
      ctx.fillStyle='#05010f';ctx.fillRect(a.x+6,a.y+7,5,5);ctx.fillRect(a.x+19,a.y+7,5,5);ctx.fillStyle='#ff2e97';});
    // proiettili nemici
    ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ebul.forEach(b=>ctx.fillRect(b.x,b.y,4,10));
    ctx.shadowBlur=0;
  }
  window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){move=-1;e.preventDefault();}if(k==='arrowright'||k==='d'){move=1;e.preventDefault();}});
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowleft','a','arrowright','d'].includes(k))move=0;});
  document.querySelectorAll('.dpad button').forEach(b=>{const d=+b.dataset.d;const on=()=>move=d,off=()=>move=0;
    b.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});b.addEventListener('touchend',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);});
  function pointAt(clientX){const r=cv.getBoundingClientRect();const x=(clientX-r.left)/r.width*W;if(running)ship.x=Math.max(0,Math.min(W-ship.w,x-ship.w/2));}
  cv.addEventListener('mousemove',e=>{if(move===0)pointAt(e.clientX);});
  cv.addEventListener('touchmove',e=>{e.preventDefault();pointAt(e.touches[0].clientX);},{passive:false});
  startBtn.addEventListener('click',start);
  reset();running=false;draw();
})();
</script>
</body>
</html>
