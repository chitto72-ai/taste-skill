<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Test di Reazione — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-size:clamp(22px,6vw,38px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:22px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.pad{width:100%;max-width:460px;margin:0 auto;aspect-ratio:16/10;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;border:2px solid rgba(0,255,240,.4);transition:background .05s;text-align:center;padding:20px}
.pad.wait{background:linear-gradient(160deg,#3a0d1e,#5a1030);border-color:var(--magenta)}
.pad.go{background:linear-gradient(160deg,#0d3a12,#125a1c);border-color:var(--green)}
.pad.idle{background:rgba(5,1,15,.7)}
.pad h2{font-size:clamp(22px,7vw,34px);letter-spacing:2px;text-transform:uppercase}
.pad p{margin-top:12px;color:var(--text);font-size:14px;letter-spacing:1px}
.pad.go h2{color:#eaffea;text-shadow:0 0 16px #39ff14}
.controls{margin-top:16px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Test di Reazione</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Ultimo: <b id="last">—</b></span><span>Media: <b id="avg">—</b></span><span class="rec">Record: <b id="best">—</b></span></div>

  <div class="pad idle" id="pad">
    <h2 id="padt">Test di Reazione</h2>
    <p id="padp">Tocca per iniziare. Quando diventa verde, tocca il più in fretta possibile!</p>
  </div>

  <div class="controls">Tocca l'area o premi la barra spaziatrice · Non anticipare il verde!</div>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const pad=document.getElementById('pad'),padt=document.getElementById('padt'),padp=document.getElementById('padp');
  const lastEl=document.getElementById('last'),avgEl=document.getElementById('avg'),bestEl=document.getElementById('best');
  const KEY='sg_reazione_best';
  let best=localStorage.getItem(KEY);bestEl.textContent=best?best+' ms':'—';
  let state='idle',startT,timeoutId,times=[];
  function setPad(cls,t,p){pad.className='pad '+cls;padt.textContent=t;padp.textContent=p;}
  function arm(){
    state='wait';setPad('wait','Attendi il verde…','Non toccare finché non diventa verde!');
    timeoutId=setTimeout(()=>{state='go';startT=performance.now();setPad('go','TOCCA ORA!','');},1200+Math.random()*2800);
  }
  function trigger(){
    if(state==='idle'){arm();return;}
    if(state==='wait'){clearTimeout(timeoutId);state='early';setPad('idle','Troppo presto!','Hai anticipato il verde. Tocca per riprovare.');state='idle';return;}
    if(state==='go'){
      const ms=Math.round(performance.now()-startT);
      times.push(ms);lastEl.textContent=ms+' ms';
      const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);avgEl.textContent=avg+' ms';
      let extra='';
      if(!best||ms<+best){best=ms;localStorage.setItem(KEY,best);bestEl.textContent=best+' ms';extra=' 🏆 Record!';}
      state='idle';setPad('idle',ms+' ms'+extra,'Tocca per un altro tentativo.');return;
    }
    if(state==='early'){state='idle';arm();}
  }
  pad.addEventListener('mousedown',e=>{e.preventDefault();trigger();});
  pad.addEventListener('touchstart',e=>{e.preventDefault();trigger();},{passive:false});
  window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();trigger();}});
})();
</script>
</body>
</html>
