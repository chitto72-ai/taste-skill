<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Serpente — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(26px,7vw,42px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:22px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:420px;margin:0 auto;touch-action:none}
canvas{background:rgba(5,1,15,.85);border:2px solid rgba(0,255,240,.4);border-radius:10px;box-shadow:0 0 26px rgba(0,255,240,.15);width:100%;height:auto;display:block;image-rendering:pixelated}
.controls{margin-top:14px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.overlay{position:absolute;inset:0;background:rgba(5,1,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:26px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:8px;justify-content:center;margin:18px auto 0}
.dpad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.4);color:var(--cyan);border-radius:10px;font-size:22px;font-family:inherit;cursor:pointer}
.dpad button:active{background:rgba(0,255,240,.3)}
.dpad .up{grid-area:1/2}.dpad .left{grid-area:2/1}.dpad .right{grid-area:2/3}.dpad .down{grid-area:3/2}
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1897982289083904" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Serpente</h1>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Punti: <b id="score">0</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovt">Serpente</h2>
      <p id="ovp">Usa le frecce, WASD, i tasti a schermo o scorri col dito.</p>
      <button class="btn" id="start">Gioca</button>
    </div>
  </div>

  <div class="controls">Frecce / WASD · Swipe sul campo · Pausa: P</div>
  <div class="dpad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="right" data-d="right">▶</button>
    <button class="down" data-d="down">▼</button>
  </div>

  <!-- AdSense attivo (Publisher ID ca-pub-1897982289083904) — modifica qui se cambi account -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-1897982289083904" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const cv=document.getElementById('game'),ctx=cv.getContext('2d');
  const N=20, S=cv.width/N; // 20x20 celle
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),startBtn=document.getElementById('start');
  const KEY='sg_snake_best';
  let best=+(localStorage.getItem(KEY)||0); bestEl.textContent=best;
  let snake,dir,nextDir,food,score,loop,alive,paused,speed;

  function spawnFood(){
    do{food={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; alive=true; paused=false; speed=130;
    scoreEl.textContent=0; spawnFood();
  }
  function start(){
    reset(); ov.classList.add('hidden');
    clearInterval(loop); loop=setInterval(step,speed);
    draw();
  }
  function gameOver(){
    alive=false; clearInterval(loop);
    if(score>best){best=score;localStorage.setItem(KEY,best);bestEl.textContent=best;}
    ovt.textContent='Game Over'; ovp.innerHTML='Punteggio: <b>'+score+'</b><br>Record: '+best;
    startBtn.textContent='Rigioca'; ov.classList.remove('hidden');
  }
  function step(){
    if(paused)return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){return gameOver();}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10; scoreEl.textContent=score; spawnFood();
      if(speed>60&&score%50===0){speed-=8;clearInterval(loop);loop=setInterval(step,speed);}
    } else snake.pop();
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // griglia leggera
    ctx.strokeStyle='rgba(0,255,240,0.05)';
    for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(cv.width,i*S);ctx.stroke();}
    // cibo
    ctx.fillStyle='#ff2e97';ctx.shadowColor='#ff2e97';ctx.shadowBlur=12;
    ctx.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);
    // serpente
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?'#ffe600':'#39ff14';
      ctx.shadowColor=i===0?'#ffe600':'#39ff14';ctx.shadowBlur=10;
      ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);
    });
    ctx.shadowBlur=0;
  }
  function setDir(d){
    const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
    if(!m)return;
    if(m.x===-dir.x&&m.y===-dir.y)return; // no inversione
    nextDir=m;
  }
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
    if(map[k]){e.preventDefault();setDir(map[k]);}
    if(k==='p'&&alive){paused=!paused;}
  });
  document.querySelectorAll('.dpad button').forEach(b=>{
    b.addEventListener('click',()=>{if(alive)setDir(b.dataset.d);});
  });
  // swipe
  let tx,ty;
  cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
  cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',e=>{
    if(tx==null)return;const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up');
    tx=ty=null;
  },{passive:true});
  startBtn.addEventListener('click',start);
  reset();alive=false;draw();
})();
</script>
</body>
</html>
