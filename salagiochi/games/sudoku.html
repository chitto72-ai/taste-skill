<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sudoku — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(26px,7vw,42px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:20px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;max-width:396px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(9,1fr);gap:0;background:rgba(0,255,240,.4);border:3px solid var(--cyan);border-radius:8px;overflow:hidden;aspect-ratio:1}
.cell{background:rgba(5,1,15,.85);display:flex;align-items:center;justify-content:center;font-size:clamp(15px,5vw,22px);font-weight:bold;cursor:pointer;border:1px solid rgba(157,78,221,.25);aspect-ratio:1;color:var(--cyan)}
.cell.fixed{color:var(--text);background:rgba(157,78,221,.14);cursor:default}
.cell.sel{background:rgba(255,230,0,.22);box-shadow:inset 0 0 0 2px var(--yellow)}
.cell.err{color:var(--magenta)!important}
.cell.br{border-right:2px solid var(--cyan)}
.cell.bb{border-bottom:2px solid var(--cyan)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:396px;margin:14px auto 0}
.pad button{background:rgba(0,255,240,.1);border:2px solid rgba(0,255,240,.35);color:var(--cyan);border-radius:8px;padding:12px 0;font-family:inherit;font-size:18px;font-weight:bold;cursor:pointer}
.pad button:active{background:rgba(0,255,240,.3)}
.controls{margin-top:12px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.newbtn{margin-top:12px}
.overlay{position:absolute;inset:-6px;background:rgba(5,1,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Sudoku</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Tempo: <b id="time">0</b>s</span><span>Errori: <b id="err">0</b></span><span class="rec">Record: <b id="best">—</b></span></div>

  <div class="stage">
    <div class="board" id="board"></div>
    <div class="overlay hidden" id="ov">
      <h2 id="ovt"></h2>
      <p id="ovp"></p>
      <button class="btn" id="restart">Nuovo Sudoku</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button>
    <button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-n="0">✕</button>
  </div>
  <div class="controls">Tocca una casella, poi un numero · ✕ cancella · Tastiera 1-9</div>
  <button class="btn newbtn" id="newgame">Nuovo Sudoku</button>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const boardEl=document.getElementById('board'),timeEl=document.getElementById('time'),errEl=document.getElementById('err'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp');
  const KEY='sg_sudoku_best';
  let best=localStorage.getItem(KEY);bestEl.textContent=best?best+'s':'—';
  let sol,puzzle,fixed,sel,secs,errors,timer,cells=[],done;
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  function valid(b,r,c,n){
    for(let i=0;i<9;i++){if(b[r*9+i]===n||b[i*9+c]===n)return false;}
    const br=r-r%3,bc=c-c%3;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(b[(br+i)*9+bc+j]===n)return false;
    return true;
  }
  function solve(b){
    const i=b.indexOf(0);if(i<0)return true;const r=(i/9)|0,c=i%9;
    for(const n of shuffle([1,2,3,4,5,6,7,8,9])){if(valid(b,r,c,n)){b[i]=n;if(solve(b))return true;b[i]=0;}}
    return false;
  }
  function generate(){
    sol=new Array(81).fill(0);solve(sol);
    puzzle=sol.slice();fixed=new Array(81).fill(true);
    let remove=48;const idx=shuffle([...Array(81).keys()]);
    for(const i of idx){if(remove<=0)break;puzzle[i]=0;fixed[i]=false;remove--;}
  }
  function build(){
    boardEl.innerHTML='';cells=[];
    for(let i=0;i<81;i++){
      const c=document.createElement('div');const r=(i/9)|0,col=i%9;
      c.className='cell'+(col%3===2&&col!==8?' br':'')+(r%3===2&&r!==8?' bb':'');
      c.dataset.i=i;c.addEventListener('click',()=>select(i));
      boardEl.appendChild(c);cells.push(c);
    }
  }
  function render(){
    for(let i=0;i<81;i++){
      const c=cells[i];c.textContent=puzzle[i]||'';
      c.classList.toggle('fixed',fixed[i]);c.classList.toggle('sel',sel===i);c.classList.remove('err');
      if(puzzle[i]&&!fixed[i]&&puzzle[i]!==sol[i])c.classList.add('err');
    }
  }
  function select(i){if(done)return;sel=i;render();}
  function put(n){
    if(done||sel==null||fixed[sel])return;
    if(n!==0&&puzzle[sel]===0&&n!==sol[sel])errors++,errEl.textContent=errors;
    puzzle[sel]=n;render();check();
  }
  function check(){
    for(let i=0;i<81;i++)if(puzzle[i]!==sol[i])return;
    done=true;clearInterval(timer);
    let msg='Risolto in <b>'+secs+'</b> secondi con '+errors+' errori.';
    if(!best||secs<+best){best=secs;localStorage.setItem(KEY,best);bestEl.textContent=best+'s';msg+='<br>🏆 Nuovo record!';}
    ovt.textContent='Completato!';ovp.innerHTML=msg;ov.classList.remove('hidden');
  }
  function reset(){
    generate();sel=null;secs=0;errors=0;done=false;
    timeEl.textContent=0;errEl.textContent=0;ov.classList.add('hidden');
    clearInterval(timer);timer=setInterval(()=>{secs++;timeEl.textContent=secs;},1000);
    render();
  }
  document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('click',()=>put(+b.dataset.n)));
  window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')put(+e.key);else if(e.key==='0'||e.key==='Backspace'||e.key==='Delete')put(0);});
  document.getElementById('restart').addEventListener('click',reset);
  document.getElementById('newgame').addEventListener('click',reset);
  build();reset();
})();
</script>
</body>
</html>
