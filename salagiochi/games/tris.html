<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tris — Sala Giochi</title>
<style>
:root{--bg0:#05010f;--bg1:#0d0524;--bg2:#16093d;--cyan:#00fff0;--magenta:#ff2e97;--yellow:#ffe600;--green:#39ff14;--purple:#9d4edd;--text:#e8e6ff;--dim:#8a86b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 10%,rgba(157,78,221,.25),transparent 40%),radial-gradient(circle at 80% 90%,rgba(255,46,151,.2),transparent 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));background-attachment:fixed;color:var(--text);font-family:"Courier New",monospace;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 48px;text-align:center}
.back{display:inline-block;color:var(--cyan);text-decoration:none;letter-spacing:2px;font-size:13px;margin-bottom:10px;text-transform:uppercase}
.back:hover{color:var(--magenta)}
.pixel-title{font-weight:bold;letter-spacing:3px;text-transform:uppercase;font-size:clamp(26px,7vw,42px);text-shadow:2px 2px 0 var(--magenta),-2px -2px 0 var(--cyan),0 0 16px rgba(0,255,240,.5);margin-bottom:12px}
.adslot{margin:14px auto;min-height:60px;max-width:468px;border:1px dashed rgba(0,255,240,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:1px;overflow:hidden}
.hud{display:flex;justify-content:center;gap:20px;margin:8px 0 12px;font-size:15px;letter-spacing:1px}
.hud b{color:var(--yellow)}.hud .rec b{color:var(--green)}
.stage{position:relative;width:100%;max-width:340px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1}
.cell{background:rgba(5,1,15,.7);border:2px solid rgba(0,255,240,.35);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,14vw,64px);font-weight:bold;cursor:pointer;user-select:none}
.cell.x{color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
.cell.o{color:var(--magenta);text-shadow:0 0 14px var(--magenta)}
.cell.win{background:rgba(57,255,20,.18);border-color:var(--green)}
.status{margin:14px 0 4px;color:var(--yellow);letter-spacing:2px;font-size:15px;min-height:20px}
.controls{margin-top:6px;color:var(--dim);font-size:12px;letter-spacing:1px;line-height:1.7}
.newbtn{margin-top:14px}
.overlay{position:absolute;inset:-6px;background:rgba(5,1,15,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;gap:14px;padding:16px}
.overlay.hidden{display:none}
.overlay h2{color:var(--magenta);font-size:24px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(255,46,151,.6)}
.overlay p{color:var(--text);font-size:15px;line-height:1.5}
.btn{cursor:pointer;background:linear-gradient(180deg,var(--magenta),#c01e70);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-weight:bold;letter-spacing:2px;font-size:15px;text-transform:uppercase;box-shadow:0 0 16px rgba(255,46,151,.5)}
.btn:active{transform:translateY(2px)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">◂ SALA GIOCHI</a>
  <h1 class="pixel-title">Tris</h1>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>

  <div class="hud"><span>Vittorie: <b id="wins">0</b></span><span>Pareggi: <b id="draws">0</b></span><span class="rec">Record: <b id="best">0</b></span></div>

  <div class="stage">
    <div class="grid" id="grid"></div>
    <div class="overlay hidden" id="ov">
      <h2 id="ovt"></h2>
      <p id="ovp"></p>
      <button class="btn" id="again">Rigioca</button>
    </div>
  </div>

  <div class="status" id="status">Tocca a te — sei la X</div>
  <div class="controls">Tu sei la <b style="color:var(--cyan)">X</b>, il computer la <b style="color:var(--magenta)">O</b>. Tocca o clicca una casella. Tastiera: 1-9</div>
  <button class="btn newbtn" id="newgame">Nuova Partita</button>

  <!-- SOSTITUISCI CON IL TUO ID: cambia ca-pub-XXXXXXXXXXXXXXXX con il tuo Publisher ID AdSense -->
  <div class="adslot">
    <ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <span>Spazio pubblicitario (AdSense)</span>
  </div>
</div>

<script>
(function(){
  try{(adsbygoogle=window.adsbygoogle||[]).push({});(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
  const gridEl=document.getElementById('grid'),statusEl=document.getElementById('status');
  const winsEl=document.getElementById('wins'),drawsEl=document.getElementById('draws'),bestEl=document.getElementById('best');
  const ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp');
  const KEY='sg_tris_best';
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let best=+(localStorage.getItem(KEY)||0);bestEl.textContent=best;
  let wins=0,draws=0,board,cells=[],locked;
  for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;c.addEventListener('click',()=>play(i));gridEl.appendChild(c);cells.push(c);}
  function reset(){board=Array(9).fill('');locked=false;ov.classList.add('hidden');cells.forEach(c=>{c.className='cell';c.textContent='';});statusEl.textContent='Tocca a te — sei la X';}
  function winner(b){for(const [a,c,d] of LINES){if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {who:b[a],line:[a,c,d]};}if(b.every(x=>x))return {who:'draw'};return null;}
  function play(i){
    if(locked||board[i])return;
    board[i]='X';cells[i].textContent='X';cells[i].classList.add('x');
    let r=winner(board);if(r)return finish(r);
    locked=true;statusEl.textContent='Il computer pensa...';
    setTimeout(()=>{const m=bestMove(board);board[m]='O';cells[m].textContent='O';cells[m].classList.add('o');
      const r2=winner(board);if(r2)return finish(r2);locked=false;statusEl.textContent='Tocca a te — sei la X';},350);
  }
  function bestMove(b){
    let bs=-Infinity,mv=-1;
    for(let i=0;i<9;i++){if(!b[i]){b[i]='O';const s=minimax(b,0,false);b[i]='';if(s>bs){bs=s;mv=i;}}}
    return mv;
  }
  function minimax(b,depth,max){
    const r=winner(b);
    if(r){if(r.who==='O')return 10-depth;if(r.who==='X')return depth-10;return 0;}
    if(max){let bs=-Infinity;for(let i=0;i<9;i++){if(!b[i]){b[i]='O';bs=Math.max(bs,minimax(b,depth+1,false));b[i]='';}}return bs;}
    else{let bs=Infinity;for(let i=0;i<9;i++){if(!b[i]){b[i]='X';bs=Math.min(bs,minimax(b,depth+1,true));b[i]='';}}return bs;}
  }
  function finish(r){
    locked=true;
    if(r.line)r.line.forEach(i=>cells[i].classList.add('win'));
    if(r.who==='X'){wins++;winsEl.textContent=wins;if(wins>best){best=wins;localStorage.setItem(KEY,best);bestEl.textContent=best;}
      ovt.textContent='Hai Vinto!';ovp.innerHTML='Complimenti, hai battuto il computer!<br>Vittorie totali: '+wins;}
    else if(r.who==='O'){ovt.textContent='Hai Perso';ovp.innerHTML='Il computer ha vinto questa volta.';}
    else{draws++;drawsEl.textContent=draws;ovt.textContent='Pareggio';ovp.innerHTML='Nessuno ha vinto. Riprova!';}
    setTimeout(()=>ov.classList.remove('hidden'),700);
  }
  window.addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=9)play(n-1);});
  document.getElementById('again').addEventListener('click',reset);
  document.getElementById('newgame').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
